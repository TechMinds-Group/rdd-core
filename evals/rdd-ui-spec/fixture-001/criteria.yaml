---
name: "UI Spec — 2 atores, 3 casos de uso"
description: >
  REQUIREMENTS.md (atores, RNs EARS, UCs) + API_CONTRACTS.md.
  UI_SPEC deve descrever telas por ator e validar RNs de exibição.
inputs_required: [REQUIREMENTS.md, API_CONTRACTS.md]

checks:
  - type: file_exists
    path: "specs/UI_SPEC.md"
    severity: error

  - type: contains
    path: "specs/UI_SPEC.md"
    pattern: "Operador"
    severity: error

  - type: contains
    path: "specs/UI_SPEC.md"
    pattern: "Consultor"
    severity: error

  - type: contains
    path: "specs/UI_SPEC.md"
    pattern: "RN-002"
    severity: error

  - type: contains
    path: "specs/UI_SPEC.md"
    pattern: "RN-003"
    severity: error

  - type: contains
    path: "specs/UI_SPEC.md"
    pattern: "BLOQ_DUPLICADO"
    severity: error

  - type: cross_ref
    path: "specs/UI_SPEC.md"
    pattern: "RN-(\\d+)"
    sources: ["REQUIREMENTS.md"]
    severity: error

  - type: line_count_range
    path: "specs/UI_SPEC.md"
    min: 60
    max: 500
    severity: warning

  - type: no_todos
    path: "specs/UI_SPEC.md"
    patterns: ["TODO", "FIXME", "PEND-"]
    severity: warning

  - type: frontmatter_valid
    path: "specs/UI_SPEC.md"
    severity: error

  - type: reference_match
    path: "specs/UI_SPEC.md"
    expected: "output-expected/UI_SPEC.md"
    severity: error
