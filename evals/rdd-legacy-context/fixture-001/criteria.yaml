---
name: "Legacy Context — schema Oracle vira contexto legado"
description: >
  PROJECT_CHARTER (legado: true) + legado/schema.sql (SDA_BLOQUEIO).
  LEGACY_CONTEXT deve documentar a tabela legada, a flag de situação e o
  glossário de equivalência com o módulo novo.
inputs_required: [PROJECT_CHARTER.md]

checks:
  - type: file_exists
    path: "support/LEGACY_CONTEXT.md"
    severity: error

  - type: contains
    path: "support/LEGACY_CONTEXT.md"
    pattern: "SDA_BLOQUEIO"
    severity: error

  - type: contains
    path: "support/LEGACY_CONTEXT.md"
    pattern: "Oracle"
    severity: error

  - type: contains
    path: "support/LEGACY_CONTEXT.md"
    pattern: "FLG_SITUACAO"
    severity: error

  - type: contains
    path: "support/LEGACY_CONTEXT.md"
    pattern: "HIST_BLOQUEIO"
    severity: warning

  - type: line_count_range
    path: "support/LEGACY_CONTEXT.md"
    min: 40
    max: 300
    severity: warning

  - type: frontmatter_valid
    path: "support/LEGACY_CONTEXT.md"
    severity: error
