---
name: "Subagent Creator — arquivo do agente com front matter válido"
description: >
  Solicitação de criação de subagent rdd-coverage-auditor para auditar
  cobertura de RNs em módulos. A skill gera agents/rdd-coverage-auditor.md
  com front matter (name, description), seções de Lê/Gera/Nunca edita,
  Tools e Modo de erro.
inputs_required: []

checks:
  - type: file_exists
    path: "agents/rdd-coverage-auditor.md"
    severity: error

  - type: frontmatter_valid
    path: "agents/rdd-coverage-auditor.md"
    severity: error

  - type: contains
    path: "agents/rdd-coverage-auditor.md"
    pattern: "name: rdd-coverage-auditor"
    severity: error

  - type: contains
    path: "agents/rdd-coverage-auditor.md"
    pattern: "description:"
    severity: error

  - type: section_exists
    path: "agents/rdd-coverage-auditor.md"
    section: "## Tools"
    severity: error

  - type: section_exists
    path: "agents/rdd-coverage-auditor.md"
    section: "## Modo de erro"
    severity: error

  - type: line_count_range
    path: "agents/rdd-coverage-auditor.md"
    min: 30
    max: 300
    severity: warning