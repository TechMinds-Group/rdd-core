---
name: "Propagation Guard — CR implementado com artefato stale e resolvido"
description: >
  Módulo com CR-001 (status implemented, RN-026) cujo downstream
  API_CONTRACTS contém a RN (resolvido) e DATA_MODEL contém a RN mas não
  foi regenerado (stale). O guard deve persistir quality/PROPAGATION_STATUS.md
  com front matter, seções Pendentes e Resolvidos, tabela com colunas
  RN/CR/Artefatos Stale/Detectado em, e referências coerentes com o CR.
inputs_required: ["REQUIREMENTS.md", "support/CHANGE_REQUESTS.md", "specs/API_CONTRACTS.md", "specs/DATA_MODEL.md"]

checks:
  - type: file_exists
    path: "quality/PROPAGATION_STATUS.md"
    severity: error

  - type: frontmatter_valid
    path: "quality/PROPAGATION_STATUS.md"
    severity: error

  - type: section_exists
    path: "quality/PROPAGATION_STATUS.md"
    section: "## Pendentes"
    severity: error

  - type: section_exists
    path: "quality/PROPAGATION_STATUS.md"
    section: "## Resolvidos"
    severity: error

  - type: table_has_columns
    path: "quality/PROPAGATION_STATUS.md"
    columns: ["RN", "CR", "Artefatos Stale", "Detectado em"]
    severity: error

  - type: contains
    path: "quality/PROPAGATION_STATUS.md"
    pattern: "CR-001"
    severity: error

  - type: contains
    path: "quality/PROPAGATION_STATUS.md"
    pattern: "RN-026"
    severity: error

  - type: contains
    path: "quality/PROPAGATION_STATUS.md"
    pattern: "DATA_MODEL"
    severity: error

  - type: cross_ref
    path: "quality/PROPAGATION_STATUS.md"
    pattern: "RN-(\\d+)"
    sources: ["support/CHANGE_REQUESTS.md"]
    severity: error
