---
name: "Acceptance Criteria L2 — RN ambígua NÃO vira cenário inventado"
description: >
  NEGATIVO: RN-001 vaga ("rapidamente", "adequada") + RN-002 clara.
  RN-002 deve ter cenários Gherkin completos; RN-001 deve ser sinalizada
  como ambígua SEM cenário inventado.
inputs_required: [REQUIREMENTS.md]

checks:
  - type: file_exists
    path: "specs/ACCEPTANCE_CRITERIA.md"
    severity: error

  - type: section_exists
    path: "specs/ACCEPTANCE_CRITERIA.md"
    section: "## RN-002"
    severity: error

  - type: contains
    path: "specs/ACCEPTANCE_CRITERIA.md"
    pattern: "Dado"
    severity: error

  - type: contains
    path: "specs/ACCEPTANCE_CRITERIA.md"
    pattern: "amb"
    severity: error

  - type: cross_ref
    path: "specs/ACCEPTANCE_CRITERIA.md"
    pattern: "RN-(\\d+)"
    sources: ["REQUIREMENTS.md"]
    severity: error

  - type: line_count_range
    path: "specs/ACCEPTANCE_CRITERIA.md"
    min: 25
    max: 300
    severity: warning

  - type: frontmatter_valid
    path: "specs/ACCEPTANCE_CRITERIA.md"
    severity: error
